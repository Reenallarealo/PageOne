<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新标签页</title>
  <link rel="stylesheet" href="newtab.css">
  <script src="newtab.js" defer></script>
</head>
<body>
  <form action="https://www.google.com/search" method="get" role="search">
    <input
      id="q"
      type="search"
      name="q"
      autofocus
      autocomplete="off"
      spellcheck="false"
      role="combobox"
      aria-label="搜索"
      aria-autocomplete="list"
      aria-controls="suggestions"
      aria-expanded="false"
    >
    <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
  </form>
</body>
</html>
